# Fork-only build (RyQuantum/crosspaste-desktop, branch ry-fixes). See ry/README.md.
#
# test     (ubuntu): ktlint + fast desktop tests, then the app-desktop jar with JDK 21,
#                    the JDK upstream releases are built with.
# package  (macos):  official release + patched classes, Sparkle off, signed with the fork
#                    certificate (secrets RY_MACOS_CODESIGN_P12 / RY_MACOS_CODESIGN_PASSWORD).
#                    On a tag <UPSTREAM_TAG>-ry.<FORK_REV> it also publishes a GitHub release.
name: "ry: macOS build"

on:
  push:
    branches: [ ry-fixes ]
    tags: [ '*-ry.*' ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ry-macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Cache JetBrains Runtime JDK
        uses: actions/cache@v5
        with:
          path: ./app/jbr
          key: jbr-linux-${{ hashFiles('**/jbr.yaml') }}

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev

      - name: Right-size Gradle for the hosted runner
        run: |
          {
            echo ""
            echo "# CI-only overrides"
            echo "org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8 -Dkotlin.daemon.jvm.options=-Xmx4g"
            echo "org.gradle.parallel=true"
          } >> gradle.properties

      - name: Lint and test
        run: ./gradlew :app:ktlintCheck :app:desktopTest

      - name: Build app-desktop jar
        run: ./gradlew :app:desktopJar

      - name: Upload jar
        uses: actions/upload-artifact@v7
        with:
          name: app-desktop-jar
          path: app/build/libs/app-desktop-*.jar
          if-no-files-found: error

  package:
    needs: test
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check base tag and version
        run: |
          . ry/fork.env
          # The fork does not receive upstream tags created after it was forked
          git fetch --no-tags https://github.com/CrossPaste/crosspaste-desktop.git "+refs/tags/$UPSTREAM_TAG:refs/tags/$UPSTREAM_TAG"
          git merge-base --is-ancestor "refs/tags/$UPSTREAM_TAG" HEAD || { echo "HEAD is not based on $UPSTREAM_TAG"; exit 1; }
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "${UPSTREAM_TAG}-ry.${FORK_REV}" ]; then
            echo "tag $GITHUB_REF_NAME does not match ry/fork.env (${UPSTREAM_TAG}-ry.${FORK_REV})"; exit 1
          fi

      - name: Download jar
        uses: actions/download-artifact@v8
        with:
          name: app-desktop-jar
          path: built

      - name: Download official release
        run: |
          . ry/fork.env
          base="https://github.com/CrossPaste/crosspaste-desktop/releases/download/$UPSTREAM_TAG"
          name="crosspaste-${UPSTREAM_VERSION}-${UPSTREAM_TAG##*.}-mac-aarch64.zip"
          curl -sSfL -o checksum.txt "$base/checksum.txt"
          curl -sSfL -o official.zip "$base/$name"
          want="$(awk -v n="$name" '$2 == n { print $1 }' checksum.txt)"
          got="$(shasum -a 256 official.zip | awk '{ print $1 }')"
          [ -n "$want" ] && [ "$want" = "$got" ] || { echo "checksum mismatch for $name: want '$want' got '$got'"; exit 1; }

      - name: Import signing certificate
        env:
          P12: ${{ secrets.RY_MACOS_CODESIGN_P12 }}
          P12_PASSWORD: ${{ secrets.RY_MACOS_CODESIGN_PASSWORD }}
        run: |
          [ -n "$P12" ] || { echo "secret RY_MACOS_CODESIGN_P12 is not set"; exit 1; }
          kc="$RUNNER_TEMP/ry-signing.keychain-db"
          kp="$(openssl rand -hex 16)"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/codesign.p12"
          security create-keychain -p "$kp" "$kc"
          security set-keychain-settings "$kc"
          security unlock-keychain -p "$kp" "$kc"
          security import "$RUNNER_TEMP/codesign.p12" -k "$kc" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$kp" "$kc" > /dev/null
          # codesign --keychain still resolves the identity through the search list
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          security find-identity -p codesigning "$kc"
          rm -f "$RUNNER_TEMP/codesign.p12"
          echo "RY_SIGN_KEYCHAIN=$kc" >> "$GITHUB_ENV"

      - name: Package
        run: |
          . ry/fork.env
          bash ry/mac/package.sh official.zip "built/app-desktop-$UPSTREAM_VERSION.jar" dist

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: crosspaste-mac
          path: dist/
          if-no-files-found: error

      - name: Publish release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          . ry/fork.env
          {
            echo "macOS (Apple Silicon) build of CrossPaste $UPSTREAM_TAG with the ry-fixes patches, signed with the fork's self-signed certificate."
            echo
            echo "- Base: upstream release \`$UPSTREAM_TAG\` (sync protocol unchanged)"
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Install: \`pwsh bin/crosspaste-mac.ps1 upgrade\` in RyQuantum/omnicraft (private). Built-in auto-update is disabled."
            echo
            echo "Patches: see \`ry/README.md\`."
          } > notes.md
          gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --notes-file notes.md

      - name: Remove signing keychain
        if: always()
        run: |
          [ -n "${RY_SIGN_KEYCHAIN:-}" ] && security delete-keychain "$RY_SIGN_KEYCHAIN" || true
